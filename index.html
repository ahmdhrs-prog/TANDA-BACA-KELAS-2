<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Pembelajaran - Taman Kota Tanda Baca</title>
<meta property="og:title" content="Media Pembelajaran - Taman Kota Tanda Baca">
<meta property="og:description" content="Jelajah Interaktif Mengenal Tanda Baca Dasar untuk Kelas II SD">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #4FA3D1;
    --grass: #6BBF59;
    --titik: #2B6CB0;
    --koma: #D97706;
    --tanya: #0D9488;
    --seru: #DC2626;
    --cream: #FFF9EC;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #7DD3FC 0%, #BAE6FD 48%, #86EFAC 48%, #4ADE80 100%);
    min-height: 100vh;
    overflow-x: hidden;
    color: #1E293B;
    display: flex;
    flex-direction: column;
  }

  /* ================= HALAMAN 1: IDENTITAS AWAL ================= */
  .screen-section {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }
  .screen-section.active {
    display: flex;
  }

  .intro-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .intro-card {
    background: var(--cream);
    border: 5px solid #1E293B;
    border-radius: 32px;
    max-width: 960px;
    width: 100%;
    padding: 24px 30px;
    box-shadow: 0 12px 0 #1E293B;
    text-align: center;
    animation: popIn 0.3s ease-out;
  }

  .badge-tag {
    display: inline-block;
    background: #FACC15;
    border: 3px solid #1E293B;
    border-radius: 50px;
    padding: 5px 18px;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.92rem;
    margin-bottom: 10px;
  }

  .intro-card h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(1.7rem, 3.8vw, 2.5rem);
    color: #1E3A8A;
    margin-bottom: 4px;
  }

  .intro-subtitle {
    font-size: 1rem;
    font-weight: 700;
    color: #475569;
    margin-bottom: 18px;
  }

  .identity-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    text-align: left;
    margin-bottom: 16px;
  }

  .id-box {
    background: #FFFFFF;
    border: 3px solid #CBD5E1;
    border-radius: 20px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }

  .id-box h3 {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.08rem;
    color: #0F172A;
    margin-bottom: 8px;
    border-bottom: 2px dashed #CBD5E1;
    padding-bottom: 6px;
  }

  .id-box p, .id-box li {
    font-size: 0.94rem;
    line-height: 1.55;
    color: #334155;
  }

  .id-box ul {
    margin-left: 18px;
    margin-top: 4px;
  }

  /* PANEL FOTO LANDSCAPE */
  .photo-box {
    grid-column: span 2;
    background: #FFFFFF;
    border: 3px solid #CBD5E1;
    border-radius: 20px;
    padding: 14px;
    margin-bottom: 16px;
    text-align: center;
  }

  .photo-wrapper {
    width: 100%;
    max-height: 280px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #94A3B8;
    margin-bottom: 10px;
    background: #E2E8F0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-caption {
    font-size: 0.92rem;
    color: #1E293B;
    line-height: 1.5;
  }

  .photo-caption strong {
    color: #1E3A8A;
  }

  .btn-start-main {
    background: #16A34A;
    color: #FFFFFF;
    border: 4px solid #1E293B;
    border-radius: 50px;
    padding: 12px 36px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.25rem;
    cursor: pointer;
    box-shadow: 0 6px 0 #1E293B;
    transition: transform 0.1s;
    display: inline-block;
  }

  .btn-start-main:hover {
    background: #15803D;
  }

  .btn-start-main:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1E293B;
  }

  /* ================= HALAMAN 2: MATERI INTI ================= */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    z-index: 10;
    flex-wrap: wrap;
    gap: 10px;
  }

  .nav-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn-pill {
    background: #FFFFFF;
    border: 3px solid #1E293B;
    border-radius: 50px;
    padding: 8px 14px;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 4px 0 #1E293B;
    transition: transform 0.1s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-pill:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #1E293B;
  }

  .title-board {
    background: #92400E;
    border: 4px solid #451A03;
    border-radius: 20px;
    padding: 10px 24px;
    text-align: center;
    color: #FEF3C7;
    box-shadow: 0 6px 0 #451A03;
  }

  .title-board h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(1.2rem, 2.5vw, 1.85rem);
  }

  .title-board p {
    font-size: 0.86rem;
    color: #FDE68A;
    font-weight: 700;
  }

  .map-canvas {
    position: relative;
    flex: 1;
    max-width: 1150px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
    align-items: center;
  }

  .road-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 65%; height: 60%;
    border: 18px dashed #FDE68A;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.85;
  }

  .zone-card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.95);
    border: 4px solid #1E293B;
    border-radius: 28px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 0 #1E293B;
    transition: transform 0.2s;
  }

  .zone-card:hover {
    transform: translateY(-5px) scale(1.015);
  }

  .hotspot-pin {
    position: absolute;
    top: -18px; right: 20px;
    width: 46px; height: 46px;
    border-radius: 50%;
    color: #FFF;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #1E293B;
    animation: pulse 1.6s infinite;
  }
